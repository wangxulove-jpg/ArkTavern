<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ArkTavern VRM Viewer</title>
  <link rel="stylesheet" href="styles/viewer.css" />

  <!--
    MARK: Phase 1D-2C-2D — 经典脚本单包入口(无 import map)

    原 Phase 1B/1C/1D-2C-2C 入口使用 importmap + module script,
    依赖 ArkWeb 支持 import map、rawfile ESM 与正确 module MIME。

    实机停在 APP_MODULE_LOADING,代码级测试确认源码模块图、语法、bootstrap 状态机、
    Bridge 脚本、VRM 二进制结构全部正常。根因更可能来自 ArkWeb 运行时对以上三项的
    兼容问题,因此本阶段改为:

    - 移除 importmap 声明
    - 移除 module script 形式的 app.js 入口
    - 改为普通经典脚本 app.bundle.js 加载 esbuild 预打包的 IIFE 单包

    app.bundle.js 由 tools/vrm-runtime-bundle/build.mjs 生成,内联:
      - Three.js 0.176.0 (three.module.js + three.core.js + addons/)
      - @pixiv/three-vrm 3.5.5 (three-vrm.module.js)
      - ViewerCore / ViewerScene / ViewerCamera / ViewerFrameLoop /
        ViewerModelLoader / ViewerModelResourceProbe /
        ViewerUserModelLoadCoordinator
      - app.js 主体(注册 window.arkTavernViewerBridge)

    构建期依赖映射保留在 tools/vrm-runtime-bundle/import-map.json(从原 index.html
    import map 复制)。生产 index.html 不再依赖 import map。

    模块源码(scripts/app.js + scripts/viewer/*.js)保留不变,仅作为 bundle 源。
  -->
</head>

<body>
  <!--
    MARK: Viewer Root
    本文件是 ArkWeb 加载的 VRM Viewer 入口。

    Phase 1A:
    - 仅显示 Viewer 状态文本,作为 ArkWeb 加载 + 双向 Bridge 通信的最小验证。
    - 不加载 Three.js / three-vrm / 任何 3D 资源。

    Phase 1B ~ 1D-2C-2C:
    - 通过 import map 加载本地 three@0.176.0(已废弃)

    Phase 1D-2C-2D(当前):
    - 通过 app.bundle.js 加载经典 IIFE 单包(无 import map、无 ESM)
    - 在 ViewerStage 容器中挂载 WebGLRenderer / Scene / Camera / Light
    - 支持文件导入与模型加载(Phase 1D-2A ~ 1D-2C-1)

    后续阶段(规划):
    - Phase 1D-2C-2E: 实机验证 Viewer 初始化
  -->

  <div id="ViewerStage" class="viewer-stage">
    <!--
      初始占位:Phase 1A 显示状态文本。
      Phase 1B 之后 Three.js 的 canvas 会动态挂载到 ViewerStage,
      此占位在 ViewerCore.initialize 成功后由 app.js 隐藏。
    -->
    <div id="ViewerPlaceholder" class="viewer-placeholder">
      <div class="viewer-placeholder-title">ArkTavern VRM Viewer</div>
      <div id="ViewerStatusText" class="viewer-placeholder-status">UNINITIALIZED</div>
      <div id="ViewerDetailText" class="viewer-placeholder-detail">等待初始化...</div>
    </div>

    <!--
      错误覆盖层:WebGL 初始化失败等场景显示。
      由 app.js 在收到 onViewerError 时显示。
    -->
    <div id="ViewerErrorOverlay" class="viewer-error-overlay" style="display: none;">
      <div class="viewer-error-title">3D 场景初始化失败</div>
      <div id="ViewerErrorSummary" class="viewer-error-summary"></div>
    </div>
  </div>

  <!-- Viewer Bridge:负责 ArkTS ↔ JavaScript 双向通信(普通脚本,设置 window 全局对象) -->
  <script src="scripts/viewer/ViewerBridge.js"></script>

  <!--
    Phase 1D-2C-2C: bootstrap.js — 模块启动诊断与 Bridge 引导层
    作为普通经典脚本(非 module)在 app.bundle.js 之前加载,不依赖 import map。
    维护全局启动状态机,捕获 window.error / unhandledrejection,
    暴露 window.arkTavernBootstrapBridge.getBootstrapState() 供 ArkTS 查询。
    加载失败不影响页面其他资源(经典脚本失败只影响自身)。
  -->
  <script src="scripts/bootstrap.js"></script>
  <script>
    // 标记 app.bundle.js 即将开始加载(经典脚本同步执行,确保在 bundle 之前)
    window.__arkTavernBootstrapState &&
    window.__arkTavernBootstrapState.markModuleLoading();
  </script>

  <!--
    Phase 1D-2C-2D: App 入口 — 经典 IIFE 单包
    由 tools/vrm-runtime-bundle/build.mjs 生成,内联 Three.js + three-vrm + Viewer 模块。
    不依赖 import map、不依赖 rawfile ESM、不依赖 module MIME。
    普通经典脚本同步执行,在 ViewerBridge.js / bootstrap.js / markModuleLoading 之后。
  -->
  <script src="scripts/app.bundle.js"></script>
</body>

</html>
